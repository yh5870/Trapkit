[alembic]
script_location = alembic

# env.py 가 `from app.config import settings` 등 프로젝트 모듈을 import 하므로
# 실행 디렉터리(backend/)를 sys.path 앞에 추가한다.
#
# 로컬에서는 .venv 에 editable 설치(_editable_impl_trapkit_backend.pth)가 있어
# 이 설정 없이도 동작했지만, Render처럼 requirements.txt 만 설치하는 환경에서는
# ModuleNotFoundError: No module named 'app' 로 실패한다.
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S